name: docs-watch 중복 PR 자동 정리

# 루틴(claude-docs-watch)이 매일 auto/docs-watch-YYYY-MM-DD 브랜치로 PR을 만드는데,
# 직전 PR이 머지되지 않으면 같은 내용의 PR이 계속 쌓여요.
# 이 워크플로우는 새 docs-watch PR이 열리면, 그보다 오래된 docs-watch PR을
# 자동으로 닫아 항상 "가장 최신 1개"만 열려 있도록 유지해요.

on:
  pull_request:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  dedupe:
    # auto/docs-watch-* 브랜치에서 올라온 PR일 때만 동작
    if: startsWith(github.event.pull_request.head.ref, 'auto/docs-watch-')
    runs-on: ubuntu-latest
    steps:
      - name: Close older docs-watch PRs
        uses: actions/github-script@v7
        with:
          script: |
            const current = context.payload.pull_request;
            const { owner, repo } = context.repo;

            // 열려있는 PR 전부 조회 (페이지네이션)
            const open = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100,
            });

            // docs-watch 브랜치이고, 현재 PR보다 먼저 만들어진 것만 대상
            const stale = open.filter(pr =>
              pr.number !== current.number &&
              pr.head.ref.startsWith('auto/docs-watch-') &&
              new Date(pr.created_at) < new Date(current.created_at)
            );

            for (const pr of stale) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: pr.number,
                body: `중복 정리: 더 최신 docs-watch PR(#${current.number})이 열려 이 PR은 자동으로 닫습니다. 필요하면 다시 열 수 있어요.`,
              });
              await github.rest.pulls.update({
                owner, repo, pull_number: pr.number, state: 'closed',
              });
              core.info(`closed #${pr.number} (${pr.head.ref})`);
            }

            core.info(`정리 완료: ${stale.length}개 닫음, #${current.number} 유지`);
